<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harry — Bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0FB; --card:#FFFFFF; --ink:#14162B; --muted:#7A7F99; --line:#E6E8F3;
  --accent:#7C5CFF; --accent2:#4F8BFF;
  --shadow:0 10px 30px rgba(40,50,120,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1020; --card:#171A2E; --ink:#F1F2FA; --muted:#9AA0BD; --line:#262A44;
    --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1020; --card:#171A2E; --ink:#F1F2FA; --muted:#9AA0BD; --line:#262A44;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 16px/1.5 Quicksand,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
svg.i{width:22px;height:22px;fill:currentColor;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Top bar */
.top{max-width:560px;margin:0 auto;padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center}
.round-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);cursor:pointer;transition:transform .2s}
.round-btn:hover{transform:scale(1.07)}
.round-btn.sun{color:#F59E0B}
:root[data-theme="dark"] .round-btn.sun,
:root:not([data-theme="light"]) .round-btn.sun{color:#A5B4FC}

/* Hero */
.wrap{max-width:560px;margin:0 auto;padding:0 20px 60px;text-align:center}
.avatar{display:block;width:210px;height:210px;border-radius:50%;object-fit:cover;margin:28px auto 30px;box-shadow:0 0 0 6px var(--card),0 0 0 8px rgba(124,92,255,.3),0 24px 50px rgba(124,92,255,.35)}
.hi{margin:0;font-size:22px;font-weight:600;color:var(--muted)}
.name{margin:4px 0 0;font-size:clamp(38px,9vw,50px);font-weight:700;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;line-height:1.15}
.verified{width:32px;height:32px;color:#3B82F6}
.sub{margin:8px 0 30px;font-size:clamp(22px,6vw,28px);font-weight:600;color:var(--muted)}
.sub em{font-style:normal;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* Social tiles */
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.social{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px 8px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;transition:transform .2s}
.social:hover{transform:translateY(-4px)}
.circ{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;letter-spacing:.3px}
.c-dc{background:#5865F2}
.c-ig{background:linear-gradient(45deg,#F9A03F,#E1306C,#8A3AB9)}
.c-tt{background:#111}
.c-zl{background:#0068FF;font-size:15px}
.c-gh{background:#24292F}
.c-mail{background:linear-gradient(135deg,#7C5CFF,#4F8BFF)}

/* Cards */
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:22px;margin-top:20px;text-align:left}
.card h2{margin:0 0 14px;font-size:18px;font-weight:700;color:var(--muted)}

/* Project preview */
.preview{position:relative;height:170px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#7C5CFF,#4F8BFF 55%,#22D3EE);display:flex;align-items:flex-end;padding:18px;color:#fff}
.preview::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);right:-60px;top:-80px}
.preview-title{position:relative;z-index:1;font-size:24px;font-weight:700}
.preview-badge{position:absolute;z-index:1;top:14px;right:14px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
.proj-link{display:flex;justify-content:space-between;align-items:center;margin-top:14px;text-decoration:none;color:var(--ink);font-weight:600}
.proj-link span{color:var(--muted);font-weight:500;font-size:14px}
.proj-link .i{color:var(--accent)}

/* Skills */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;border-radius:999px;background:var(--bg);font-size:14px;font-weight:600}
.chip.hl{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}

/* Music */
.np{background:var(--bg);border-radius:20px;padding:18px;margin-bottom:12px}
.np-title{font-size:20px;font-weight:700;margin-bottom:10px}
.np input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.np-time{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:2px 0 6px}
.np-ctrl{display:flex;justify-content:center;align-items:center;gap:18px}
.ctl{border:0;cursor:pointer;display:grid;place-items:center;border-radius:50%;color:inherit;background:none;transition:transform .15s}
.ctl:hover{transform:scale(1.08)}
.ctl.big{width:62px;height:62px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow)}
.ctl.big .i{width:30px;height:30px}
.ctl.sm{width:44px;height:44px}
.track{width:100%;display:flex;align-items:center;gap:14px;padding:10px;border:0;border-radius:16px;background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.track:hover{background:var(--bg)}
.track .dot{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--accent);flex:none}
.track.on .dot{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}

footer{text-align:center;color:var(--muted);font-size:14px;margin-top:30px}

/* Tuyết rơi */
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

@media (max-width:420px){
  .avatar{width:180px;height:180px}
  .social{padding:18px 4px 14px}
  .circ{width:60px;height:60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 1 0-14 0v5l-2 2v1h18v-1l-2-2z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5h0v3h0V2zm0 17h0v3h0v-3zM2 12h3v0H2zm17 0h3v0h-3zM4.2 4.2l2.1 2.1L4.2 8.4zM17.7 15.9l2.1 2.1-2.1 2.1zM4.2 19.8l2.1-2.1 2.1 2.1zM17.7 8.1l2.1-2.1 2.1 2.1z"/></symbol>
  <symbol id="i-check-badge" viewBox="0 0 24 24"><path d="M23 12l-2.4-2.7.3-3.6-3.5-.8-1.9-3.1L12 3.1 8.5 1.8 6.6 4.9l-3.5.8.3 3.6L1 12l2.4 2.7-.3 3.6 3.5.8 1.9 3.1L12 20.9l3.5 1.3 1.9-3.1 3.5-.8-.3-3.6zm-12.6 4.7-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4z"/></symbol>
  <symbol id="i-go" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
</svg>

<header class="top">
  <button class="round-btn" type="button" aria-label="Đi tới liên kết" onclick="document.getElementById('links').scrollIntoView()"><svg class="i"><use href="#i-bell"/></svg></button>
  <button class="round-btn sun" id="theme" type="button" aria-label="Đổi giao diện sáng/tối"><svg class="i"><use href="#i-sun"/></svg></button>
</header>

<main class="wrap">
  <img class="avatar" src="avatar.webp" alt="Ảnh đại diện của Harry" width="210" height="210">

  <p class="hi">Hi, i am</p>
  <h1 class="name">Harry <svg class="i verified"><use href="#i-check-badge"/></svg></h1>
  <p class="sub">and I'm a <em>Designer & Developer.</em></p>

  <nav class="socials" aria-label="Liên kết">
    <a class="social" href="https://discord.gg/RA4uTrkU" target="_blank" rel="noopener"><span class="circ c-dc">DC</span>Discord</a>
    <a class="social" href="https://www.instagram.com/harry_real_channel" target="_blank" rel="noopener"><span class="circ c-ig">IG</span>Instagram</a>
    <a class="social" href="https://www.tiktok.com/@harry_real_channel" target="_blank" rel="noopener"><span class="circ c-tt">TT</span>TikTok</a>
    <a class="social" href="https://github.com/harryrealchannel-26" target="_blank" rel="noopener"><span class="circ c-gh">GH</span>GitHub</a>
    <a class="social" href="https://zalo.me/0788319329" target="_blank" rel="noopener"><span class="circ c-zl">Zalo</span>Zalo</a>
    <a class="social" href="mailto:giaphuchuynh418@gmail.com"><span class="circ c-mail">@</span>Email</a>
  </nav>

  <section class="card" id="links">
    <h2>Dự án</h2>
    <a class="preview" href="https://github.com/harryrealchannel-26/FocusStudy" target="_blank" rel="noopener" style="text-decoration:none">
      <span class="preview-badge">GitHub</span>
      <span class="preview-title">FocusStudy</span>
    </a>
    <a class="proj-link" href="https://github.com/harryrealchannel-26/FocusStudy" target="_blank" rel="noopener">
      <span style="color:var(--ink);font-weight:600">Xem mã nguồn</span>
      <svg class="i"><use href="#i-go"/></svg>
    </a>
  </section>

  <section class="card">
    <h2>Kỹ năng</h2>
    <div class="chips">
      <span class="chip hl">Thiết kế giao diện</span>
      <span class="chip hl">HTML</span>

      <span class="chip">Lập trình</span>
    </div>

  <section class="card" id="music">
    <h2>Nhạc</h2>
    <audio id="audio" preload="metadata"></audio>
    <div class="np">
      <div class="np-title" id="npTitle">Bé ơi từ từ</div>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Tua bài hát">
      <div class="np-time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <div class="np-ctrl">
        <button class="ctl sm" id="prevBtn" type="button" aria-label="Bài trước"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="ctl big" id="playBtn" type="button" aria-label="Phát"><svg class="i"><use id="playIcon" href="#i-play"/></svg></button>
        <button class="ctl sm" id="nextBtn" type="button" aria-label="Bài sau"><svg class="i"><use href="#i-next"/></svg></button>
      </div>
    </div>
    <button class="track on" type="button" data-src="be-oi-tu-tu.mp3" data-title="Bé ơi từ từ"><span class="dot"><svg class="i"><use href="#i-play"/></svg></span>Bé ơi từ từ</button>
    <button class="track" type="button" data-src="to-te-ti.mp3" data-title="Tò Te Tí"><span class="dot"><svg class="i"><use href="#i-play"/></svg></span>Tò Te Tí</button>
    <button class="track" type="button" data-src="tung-quen.mp3" data-title="Từng Quen"><span class="dot"><svg class="i"><use href="#i-play"/></svg></span>Từng Quen</button>
  </section>

  <footer>© 2026 Harry</footer>
</main>

<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function current(){
    return root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  }
  var saved=null;
  try{saved=localStorage.getItem('bio-theme')}catch(e){}
  if(saved==='dark'||saved==='light')root.setAttribute('data-theme',saved);
  btn.addEventListener('click',function(){
    var n=current()==='dark'?'light':'dark';
    root.setAttribute('data-theme',n);
    try{localStorage.setItem('bio-theme',n)}catch(e){}
  });
})();

(function(){
  var a=document.getElementById('audio'),
      tracks=[].slice.call(document.querySelectorAll('.track')),
      seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),
      title=document.getElementById('npTitle'),icon=document.getElementById('playIcon'),i=0;
  function fmt(s){if(!isFinite(s))return '0:00';var m=Math.floor(s/60),c=Math.floor(s%60);return m+':'+(c<10?'0':'')+c}
  function load(n,play){
    i=(n+tracks.length)%tracks.length;
    a.src=tracks[i].dataset.src;
    title.textContent=tracks[i].dataset.title;
    tracks.forEach(function(t,k){t.classList.toggle('on',k===i)});
    seek.value=0;cur.textContent='0:00';
    if(play)a.play().catch(function(){});
  }
  document.getElementById('playBtn').addEventListener('click',function(){a.paused?a.play().catch(function(){}):a.pause()});
  document.getElementById('prevBtn').addEventListener('click',function(){load(i-1,true)});
  document.getElementById('nextBtn').addEventListener('click',function(){load(i+1,true)});
  tracks.forEach(function(t,k){t.addEventListener('click',function(){load(k,true)})});
  a.addEventListener('play',function(){icon.setAttribute('href','#i-pause')});
  a.addEventListener('pause',function(){icon.setAttribute('href','#i-play')});
  a.addEventListener('ended',function(){load(i+1,true)});
  a.addEventListener('loadedmetadata',function(){dur.textContent=fmt(a.duration)});
  a.addEventListener('timeupdate',function(){
    if(a.duration){seek.value=a.currentTime/a.duration*100;cur.textContent=fmt(a.currentTime)}
  });
  seek.addEventListener('input',function(){if(a.duration)a.currentTime=seek.value/100*a.duration});
  load(0,false);
})();

(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=document.createElement('canvas');
  c.id='snow';c.setAttribute('aria-hidden','true');
  document.body.appendChild(c);
  var ctx=c.getContext('2d'),w,h,dpr=Math.min(window.devicePixelRatio||1,2),flakes=[],N=50;
  function size(){
    w=window.innerWidth;h=window.innerHeight;
    c.width=w*dpr;c.height=h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function make(){
    return{x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.5+1,
           v:Math.random()*0.8+0.4,p:Math.random()*Math.PI*2};
  }
  size();
  for(var k=0;k<N;k++)flakes.push(make());
  window.addEventListener('resize',size);
  ctx.fillStyle='rgba(255,255,255,.8)';
  function frame(){
    ctx.clearRect(0,0,w,h);
    for(var k=0;k<flakes.length;k++){
      var f=flakes[k];
      f.p+=0.01;
      f.y+=f.v;
      f.x+=Math.sin(f.p)*0.5;
      if(f.y>h+5){f.y=-5;f.x=Math.random()*w}
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
